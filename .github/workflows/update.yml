name: Mise a jour des listes

on:
  schedule:
    - cron: "17 4 * * *"      # tous les jours a 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:                    # rejouer si le pipeline lui-meme change
      - "fetch_filters.py"
      - "convert_webkit.py"
      - "extended_scope.py"
      - "extended_network.py"
      - "sources.json"
      - "tools/**"
      - ".github/workflows/**"

permissions:
  contents: write   # uniquement pour force-push la branche `dist`

concurrency:
  group: update-lists
  cancel-in-progress: false

jobs:
  refresh:
    # macOS est requis: `make verify` compile chaque fichier avec le WebKit du
    # systeme, seule verification qui fasse autorite. Les runners macOS sont
    # gratuits sur les depots publics. En echange, la file d'attente peut etre
    # plus longue que sur ubuntu.
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      # Epinglees par commit, pas par etiquette : une etiquette se deplace, et ce job peut
      # ecrire dans le depot. Ce sont les commits de v4.4.0 et v5.6.0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Le jeton ne reste pas dans .git/config pendant que les listes telechargees sont
          # traitees : seule l'etape de publication s'en sert, et elle le passe elle-meme.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Telecharger les listes
        run: python3 fetch_filters.py

      - name: Convertir en Content Blocker WebKit
        run: python3 convert_webkit.py

      - name: Tests et controle structurel
        run: make check

      # Barriere: rien n'est publie si un seul fichier est rejete par WebKit.
      - name: Compiler avec le WebKit du systeme
        run: make verify

      - name: Annoter la redondance entre listes
        run: make redundancy

      # main ne recoit plus rien d'automatique: le depot de code reste celui
      # de l'auteur, et les commits locaux ne divergent jamais du distant.
      # Tout ce que la machine produit part sur la branche orpheline `dist`,
      # reecrite a chaque execution.
      - name: Publier sur la branche dist
        run: |
          rm -rf dist-tree
          mkdir -p dist-tree
          # webkit-rules/ EST l'arborescence publiee: les chemins de index.json
          # (dont extended/Extended-*.json) sont valables tels quels.
          cp -R webkit-rules/. dist-tree/
          # Etat des sources, rapports de conversion et catalogue annote: ils
          # accompagnent les regles au lieu d'etre versionnes sur main.
          mkdir -p dist-tree/reports
          cp reports/*.json reports/CONVERSION.md dist-tree/reports/
          cp reports/CONVERSION.md dist-tree/
          cp filters/index.json dist-tree/filters-index.json
          cp sources.json dist-tree/sources.json
          cd dist-tree
          git init -q -b dist
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Regles WebKit — $(date -u +%Y-%m-%d)"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            dist
          echo "Publie sur la branche dist."
